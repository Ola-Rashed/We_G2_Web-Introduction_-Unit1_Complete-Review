html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 60px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.8 Cairo,"Segoe UI",Tahoma,sans-serif}
header{max-width:960px;margin:0 auto;padding:28px 16px 8px}

nav a{white-space:nowrap;padding:2px 12px;border:1px solid var(--line);border-radius:20px;color:var(--ink);text-decoration:none;background:var(--card)}

main{max-width:960px;margin:0 auto;padding:0 16px 40px}
.sec{margin-top:36px;border-inline-start:6px solid var(--a);padding-inline-start:14px}
.sec h2{margin:0 0 6px;color:var(--a);font-size:26px}
.pts{padding-inline-start:20px;margin:0 0 14px}
code{direction:ltr;unicode-bidi:isolate;background:var(--line);padding:0 5px;border-radius:4px;font-size:.9em}
.ex{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:14px 0}
.ex h3{margin:0 0 8px;font-size:18px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
pre{margin:0;background:var(--code);color:#e6e9f2;padding:12px;border-radius:8px;overflow:auto;font:13px/1.6 "JetBrains Mono",Consolas,monospace;text-align:left;white-space:pre}

.res::before{content:"Result";position:absolute;top:0;inset-inline-end:0;background:var(--a);color:#fff;font-size:12px;padding:0 8px;border-end-start-radius:8px;z-index:1}
.n{margin:8px 0 0;font-size:14px;opacity:.85}
details{margin-top:12px}summary{cursor:pointer;font-weight:700;color:var(--a)}
.k{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px;margin-top:8px}
.k div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:14px;line-height:1.5;direction:ltr;text-align:left}
.qa{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:6px;margin-top:10px}
.qa div{display:flex;justify-content:space-between;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:14px;direction:ltr;text-align:left}
.a{filter:blur(6px);cursor:pointer;color:var(--css);font-weight:700;transition:filter .2s;text-align:left}.a.on{filter:none}
@media(max-width:700px){.g{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.a{transition:none}}

{id:'l1',t:'Lesson 1: The Web and HTML',a:'html',
p:['How the web works: the browser requests a page, the server replies with `HTML` files (like a customer, a waiter and a kitchen).',
'`HTML` is a markup language that describes the structure of a page. It is not a programming language.',
'Planning stages: goals and audience, competitor research, Sitemap and User Flow, content, Wireframe and Branding, Domain, Hosting and CMS, testing and maintenance.',
'Structure: `<!DOCTYPE html>`, then `<html>` containing `<head>` (title, meta charset) and `<body>` (the visible content).',
'Self-closing tags: `<br>` `<hr>` `<img>`. For images, `src` is the file path and `alt` is the text description.',
'Lists: `ul` for bullets, `ol` for numbers (type: 1, a, A, i, I), and `dl` + `dt` + `dd` for terms and definitions.',
'Links: `href` is the destination, `target="_blank"` opens a new tab, and `id` with `#` creates a link inside the same page.'],

{id:'l2',t:'Lesson 2: Forms, Tables and Media',a:'html',
p:['`<form>` is the container for all controls. `<input type="...">` can be text, password, radio, checkbox or submit.',
'`radio` allows only one choice (same `name`), `checkbox` allows many, and `checked` sets a default selection.',
'`<select>` + `<option>` make a dropdown for long lists, `<textarea>` is for multi-line text, and `<label for>` links a label to its field.',
'`name` lets the server identify the data, `placeholder` shows a hint inside the field, and `required` blocks submission if the field is empty.',
'Tables: `table` > `tr` > `th` or `td`. `caption` is the title, `colspan` merges columns, and `rowspan` merges rows.',
'Media: `<video>` and `<audio>` (controls, autoplay, muted, loop), and `<iframe>` to embed YouTube.'],

{id:'l3',t:'Lesson 3: Styling with CSS',a:'css',
p:['`CSS` (Cascading Style Sheets) controls how a page looks. A rule is `selector { property: value; }`.',
'Three ways to add CSS: External (`<link>` to a .css file), Internal (`<style>` in the head), and Inline (`style=""` on a single element).',
'Colors: a name (red), HEX (`#FF0000`), `rgb()`, and `rgba()` (adds transparency).',
'Backgrounds: color, image, repeat (repeat-x, repeat-y, no-repeat), attachment (scroll, fixed), position, size (cover, contain), and the shorthand.',
'Font: family, size, weight, style, line-height (space between lines, not letters). Text: color, text-align, text-decoration, text-transform, letter-spacing, word-spacing.',
'Box Model from inside out: Content, Padding, Border, Margin. `border-box` includes padding and border in the width; the default is `content-box`.',
'`margin: 10px 20px` means top and bottom 10px, left and right 20px. `margin: 0 auto` centers an element horizontally.'],

{id:'l4',t:'Lesson 4: Classes, Display and Position',a:'css',
p:['`.class` can be reused on many elements, while `#id` is unique (once per page).',

'`float` pushes an element left or right so text wraps around it, and `clear` stops the wrapping and fixes footer problems.',
'`position`: static (default), relative (offset from its original spot), absolute (relative to the nearest positioned ancestor), fixed (stays on screen), sticky (relative, then sticks at `top`).',

 $('div','qa',QA.map(x=>{const[a,b]=x.split('|');return'<div><span>'+esc(a)+'</span><span class="a" tabindex="0" role="button">'+esc(b)+'</span></div>'}).join('')));
app.append(q);
q.addEventListener('click',e=>{if(e.target.classList.contains('a'))e.target.classList.toggle('on')});
q.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('a')){e.preventDefault();e.target.classList.toggle('on')}});
</script>
</body>
</html>
